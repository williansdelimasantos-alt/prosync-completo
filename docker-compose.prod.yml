# ProSync — stack de PRODUCAO para VPS (app + Postgres + HTTPS)
#
# Diferencas em relacao ao docker-compose.yml (uso local):
#   - A porta 8000 NAO e publicada: so o Caddy acessa a app pela rede interna.
#   - Caddy termina o TLS e responde em 80/443.
#   - Postgres nunca expoe porta.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prosync}
      # Obrigatorio - o compose falha se POSTGRES_PASSWORD nao estiver no .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria - defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:-prosync}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prosync} -d ${POSTGRES_DB:-prosync}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem `ports`: o banco fica acessivel apenas dentro da rede do compose.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PRODUCTION: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-prosync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prosync}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY obrigatoria - gere com python -c "import secrets; print(secrets.token_urlsafe(48))"}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      # Precisa listar o dominio real - `*` e rejeitado no startup em producao.
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS obrigatoria - ex https://prosync.mindnexo.com.br}"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-12}
      AI_ENABLED: ${AI_ENABLED:-true}
    # Sem `ports`: quem expoe para a internet e o Caddy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
